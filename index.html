 groups. Besides the Kinh, there are many **ethnic minority groups** living in different parts of the country. Some groups live in the **lowlands**, while many others live in the **highlands**. Some ethnic groups also live in the **Mekong Delta**. Each group has its own culture, language, and way of life. The **population** of each group is different. Some groups are large, but some are quite small. Although they live in different places, all ethnic groups make Viet Nam rich in culture and tradition.", "vi": "Việt Nam có 54 dân tộc. Bên cạnh người Kinh, có nhiều nhóm dân tộc thiểu số sống ở các vùng khác nhau trên cả nước. Một số nhóm sống ở vùng đồng bằng, trong khi nhiều nhóm khác sống ở vùng cao. Một số dân tộc cũng sống ở Đồng bằng sông Cửu Long. Mỗi nhóm có văn hóa, ngôn ngữ và lối sống riêng. Dân số của từng nhóm khác nhau. Một số nhóm đông dân, nhưng một số nhóm khá ít người. Mặc dù sống ở những nơi khác nhau, tất cả các dân tộc đều làm cho văn hóa và truyền thống Việt Nam thêm phong phú.", "vocab": [["ethnic minority group", "cụm danh từ", "nhóm dân tộc thiểu số", "Many ethnic minority groups live in Viet Nam."], ["lowlands", "danh từ", "vùng đồng bằng, vùng thấp", "Some groups live in the lowlands."], ["highlands", "danh từ", "vùng cao", "Many families live in the highlands."], ["Mekong Delta", "danh từ riêng", "Đồng bằng sông Cửu Long", "The Mekong Delta is in southern Viet Nam."], ["population", "danh từ", "dân số", "The population of the village is small."], ["culture", "danh từ", "văn hóa", "Each group has its own culture."], ["tradition", "danh từ", "truyền thống", "We learn about local traditions."], ["way of life", "cụm danh từ", "lối sống", "Their way of life is close to nature."]], "talk": ["How many ethnic groups are there in Viet Nam?", "Where do ethnic minority groups live?", "What makes ethnic groups different?", "Why is cultural diversity important?"], "order": [{"s": "Viet Nam has 54 ethnic groups.", "vi": "Việt Nam có 54 dân tộc."}, {"s": "Many ethnic minority groups live in Viet Nam.", "vi": "Nhiều nhóm dân tộc thiểu số sống ở Việt Nam."}, {"s": "Some families live in the lowlands.", "vi": "Một số gia đình sống ở vùng đồng bằng."}, {"s": "Other families live in the highlands.", "vi": "Những gia đình khác sống ở vùng cao."}, {"s": "The Mekong Delta is in southern Viet Nam.", "vi": "Đồng bằng sông Cửu Long nằm ở miền Nam Việt Nam."}, {"s": "Each ethnic group has its own culture.", "vi": "Mỗi dân tộc có nền văn hóa riêng."}, {"s": "The population of each group is different.", "vi": "Dân số của mỗi nhóm dân tộc là khác nhau."}, {"s": "We learn about their language and traditions.", "vi": "Chúng ta tìm hiểu về ngôn ngữ và truyền thống của họ."}, {"s": "Some groups are large but others are small.", "vi": "Một số nhóm đông dân nhưng các nhóm khác ít người."}, {"s": "Ethnic groups make Viet Nam rich in culture.", "vi": "Các dân tộc làm cho Việt Nam giàu bản sắc văn hóa."}], "translate": [{"s": "Viet Nam has 54 ethnic groups.", "vi": "Việt Nam có 54 dân tộc."}, {"s": "Some families live in the lowlands.", "vi": "Một số gia đình sống ở vùng đồng bằng."}, {"s": "The Mekong Delta is in southern Viet Nam.", "vi": "Đồng bằng sông Cửu Long nằm ở miền Nam Việt Nam."}, {"s": "The population of each group is different.", "vi": "Dân số của mỗi nhóm dân tộc là khác nhau."}, {"s": "Some groups are large but others are small.", "vi": "Một số nhóm đông dân nhưng các nhóm khác ít người."}], "quiz": [{"q": "Which Vietnamese meaning matches “ethnic minority group”?", "options": ["nhóm dân tộc thiểu số", "vùng cao", "dân số"], "answer": 0}, {"q": "Which Vietnamese meaning matches “lowlands”?", "options": ["vùng đồng bằng, vùng thấp", "Đồng bằng sông Cửu Long", "văn hóa"], "answer": 0}, {"q": "Which Vietnamese meaning matches “highlands”?", "options": ["vùng cao", "dân số", "truyền thống"], "answer": 0}, {"q": "Which Vietnamese meaning matches “Mekong Delta”?", "options": ["Đồng bằng sông Cửu Long", "văn hóa", "lối sống"], "answer": 0}, {"q": "Which Vietnamese meaning matches “population”?", "options": ["dân số", "truyền thống", "nhóm dân tộc thiểu số"], "answer": 0}], "fill": [{"sentence": "Many ________s live in Viet Nam.", "answer": "ethnic minority group"}, {"sentence": "Some groups live in the ________.", "answer": "lowlands"}, {"sentence": "Many families live in the ________.", "answer": "highlands"}], "speakModel": "Viet Nam has 54 ethnic groups. Some families live in the lowlands. The Mekong Delta is in southern Viet Nam. The population of each group is different."}, {"title": "Traditional Houses", "icon": "🏡", "trigger": "What are the houses of ethnic groups like?", "context": "Many ethnic groups in Viet Nam live in a **stilt house**. These houses are often **made from bamboo** and other **natural materials**. They stand **on high posts** and usually **overlook** rivers, fields, or **terraced fields**. Some houses are built **close to** nature, while others **face** a mountain or a forest. The Tay and Nung have stilt houses, while the Ba Na are famous for the **Rong house**, a special **communal house** **at the heart of the village**. These houses have many **unique features**. People often **decorate** them beautifully. Inside a stilt house, there may be an **open fire** and a **staircase**. Families use the house for **family gatherings** and to **receive guests**. Important village activities also **take place** in the communal house.", "vi": "Nhiều dân tộc ở Việt Nam sống trong nhà sàn. Những ngôi nhà này thường được làm từ tre và các vật liệu tự nhiên khác. Chúng đứng trên những cột cao và thường nhìn ra sông, cánh đồng hoặc ruộng bậc thang. Một số ngôi nhà được xây gần thiên nhiên, còn những ngôi nhà khác hướng về phía núi hoặc rừng. Người Tày và Nùng có nhà sàn, còn người Ba Na nổi tiếng với nhà Rông, một loại nhà cộng đồng đặc biệt ở trung tâm làng. Những ngôi nhà này có nhiều nét độc đáo. Người dân thường trang trí chúng rất đẹp. Bên trong nhà sàn có thể có bếp lửa và cầu thang. Các gia đình dùng nhà để sum họp và đón khách. Những hoạt động quan trọng của làng cũng diễn ra ở nhà cộng đồng.", "vocab": [["stilt house", "danh từ", "nhà sàn", "They live in a stilt house."], ["made from bamboo", "cụm từ", "làm từ tre", "The house is made from bamboo."], ["natural materials", "cụm danh từ", "vật liệu tự nhiên", "Wood is a natural material."], ["on high posts", "cụm từ", "trên các cột cao", "The house stands on high posts."], ["overlook", "động từ", "nhìn ra, hướng tầm nhìn ra", "Our house overlooks a field."], ["terraced fields", "danh từ", "ruộng bậc thang", "Terraced fields look beautiful."], ["close to", "giới từ", "gần", "They live close to nature."], ["face", "động từ", "hướng về phía", "The house faces the river."], ["Rong house", "danh từ", "nhà Rông", "The Ba Na have a Rong house."], ["communal house", "danh từ", "nhà cộng đồng", "Villagers meet in the communal house."], ["unique features", "cụm danh từ", "những đặc điểm độc đáo", "This house has unique features."], ["decorate", "động từ", "trang trí", "They decorate the house."], ["open fire", "danh từ", "bếp lửa mở", "There is an open fire in the house."], ["staircase", "danh từ", "cầu thang", "They climb the staircase."], ["family gathering", "danh từ", "buổi họp mặt gia đình", "We have a family gathering."], ["receive guests", "cụm động từ", "đón tiếp khách", "They receive guests at home."], ["at the heart of the village", "cụm từ", "ở trung tâm làng", "The communal house is at the heart of the village."], ["take place", "cụm động từ", "diễn ra", "Festivals take place in spring."]], "talk": ["What materials are stilt houses made from?", "Where do stilt houses usually stand?", "What is a Rong house used for?", "How do families use their traditional houses?"], "order": [{"s": "Many families live in stilt houses.", "vi": "Nhiều gia đình sống trong nhà sàn."}, {"s": "The houses are made from bamboo.", "vi": "Những ngôi nhà được làm từ tre."}, {"s": "Stilt houses stand on high posts.", "vi": "Nhà sàn đứng trên những cột cao."}, {"s": "Some houses overlook terraced fields.", "vi": "Một số ngôi nhà nhìn ra ruộng bậc thang."}, {"s": "The houses are close to nature.", "vi": "Những ngôi nhà gần gũi với thiên nhiên."}, {"s": "This house faces a mountain.", "vi": "Ngôi nhà này hướng về một ngọn núi."}, {"s": "The Rong house is a communal house.", "vi": "Nhà Rông là một nhà cộng đồng."}, {"s": "People decorate their houses beautifully.", "vi": "Người dân trang trí nhà của họ rất đẹp."}, {"s": "Families receive guests at home.", "vi": "Các gia đình đón khách tại nhà."}, {"s": "Village activities take place in the communal house.", "vi": "Các hoạt động của làng diễn ra trong nhà cộng đồng."}], "translate": [{"s": "Many families live in stilt houses.", "vi": "Nhiều gia đình sống trong nhà sàn."}, {"s": "Stilt houses stand on high posts.", "vi": "Nhà sàn đứng trên những cột cao."}, {"s": "The houses are close to nature.", "vi": "Những ngôi nhà gần gũi với thiên nhiên."}, {"s": "The Rong house is a communal house.", "vi": "Nhà Rông là một nhà cộng đồng."}, {"s": "Families receive guests at home.", "vi": "Các gia đình đón khách tại nhà."}], "quiz": [{"q": "Which Vietnamese meaning matches “stilt house”?", "options": ["nhà sàn", "vật liệu tự nhiên", "nhìn ra, hướng tầm nhìn ra"], "answer": 0}, {"q": "Which Vietnamese meaning matches “made from bamboo”?", "options": ["làm từ tre", "trên các cột cao", "ruộng bậc thang"], "answer": 0}, {"q": "Which Vietnamese meaning matches “natural materials”?", "options": ["vật liệu tự nhiên", "nhìn ra, hướng tầm nhìn ra", "gần"], "answer": 0}, {"q": "Which Vietnamese meaning matches “on high posts”?", "options": ["trên các cột cao", "ruộng bậc thang", "hướng về phía"], "answer": 0}, {"q": "Which Vietnamese meaning matches “overlook”?", "options": ["nhìn ra, hướng tầm nhìn ra", "gần", "nhà Rông"], "answer": 0}], "fill": [{"sentence": "They live in a ________.", "answer": "stilt house"}, {"sentence": "The house is ________.", "answer": "made from bamboo"}, {"sentence": "Wood is a natural material.", "answer": "natural materials"}], "speakModel": "Many families live in stilt houses. Stilt houses stand on high posts. The houses are close to nature. The Rong house is a communal house."}, {"title": "Traditional Culture", "icon": "🥁", "trigger": "What can we learn about the culture of ethnic groups?", "context": "The culture of Viet Nam’s ethnic groups is colourful and interesting. Each group has its own **traditional** customs, food, clothes, and music. People often wear beautiful **costumes** on special days and **attend festivals** together. At these festivals, they perform **folk dances** and play **musical instruments** such as the **bamboo flute** and the **gong**. Some groups also make **wooden statues** for their village or special ceremonies. In the north, some ethnic groups prepare **five-colour sticky rice**, which is both beautiful and delicious. In some families, women play a **dominant role** in family life and cultural activities.", "vi": "Văn hóa của các dân tộc Việt Nam đầy màu sắc và thú vị. Mỗi nhóm có phong tục, ẩm thực, trang phục và âm nhạc truyền thống riêng. Mọi người thường mặc những bộ trang phục đẹp vào các dịp đặc biệt và cùng nhau tham dự lễ hội. Trong những lễ hội này, họ biểu diễn điệu múa dân gian và chơi nhạc cụ như sáo trúc và cồng chiêng. Một số nhóm còn làm tượng gỗ cho làng hoặc các nghi lễ đặc biệt. Ở miền Bắc, một số dân tộc chuẩn bị món xôi ngũ sắc vừa đẹp vừa ngon. Trong một số gia đình, phụ nữ giữ vai trò chủ đạo trong đời sống gia đình và các hoạt động văn hóa.", "vocab": [["traditional", "tính từ", "truyền thống", "They wear traditional clothes."], ["costume", "danh từ", "trang phục", "Her costume is colourful."], ["attend festivals", "cụm động từ", "tham dự lễ hội", "Families attend festivals together."], ["folk dance", "danh từ", "điệu múa dân gian", "We watch a folk dance."], ["musical instrument", "danh từ", "nhạc cụ", "A gong is a musical in function pageHTML(){if(state.section==='overview')return overview();if(/^b\d$/.test(state.section))return branchHTML(+state.section[1]);if(state.section==='grammar')return grammarHTML();return finalHTML();}
function overview(){return `<div class="hero"><div><p class="eyebrow">WELCOME TO UNIT 4</p><h1>Discover the ethnic groups<br>of Viet Nam 🇻🇳</h1><p>Learn about ethnic minorities, traditional houses, festivals and daily life through four interactive branches.</p><button class="btn" onclick="go('b0')">Start learning →</button></div><div class="heroart"><div>🏔️</div><div>🏡 🥁 🌾</div></div></div><h2 class="sectiontitle">Interactive spidergram</h2><div class="mind"><div class="mindcore">ETHNIC GROUPS<br><small>OF VIET NAM</small></div>${DATA.branches.map((b,i)=>`<button class="mindnode n${i}" onclick="go('b${i}')"><span>${b.icon}</span><strong>${esc(b.title)}</strong><small>Explore →</small></button>`).join('')}</div><div class="card"><h3>How to learn</h3><p>1. Read the context → 2. Flip all vocabulary cards and listen → 3. Translate the paragraph → 4. Practise → 5. Speak → 6. Save your spidergram notes.</p><p class="muted">The grammar section includes 130 exercises. In Mixed Practice you write the <b>complete Yes/No question</b> yourself.</p></div>`}
function branchHTML(i){let b=DATA.branches[i], p='b'+i;return `<div class="pagehead"><span class="eyebrow">SPIDERGRAM • BRANCH ${i}</span><h1>${b.icon} ${esc(b.title)}</h1><p>Study the context and learn all target vocabulary before doing the practice.</p></div><section class="card"><span class="eyebrow">STEP 1 · TRIGGER & CONTEXT</span><h2>💡 ${esc(b.trigger)}</h2><div class="reading">${contextHTML(b.context)}</div><p class="muted">Read first. The Vietnamese translation is hidden until you finish your own version.</p></section><section class="card"><span class="eyebrow">STEP 2 · NEW VOCABULARY (${b.vocab.length} ITEMS)</span><h2>Flip the cards & listen</h2><p class="muted">All vocabulary items are visible. Click an individual card to flip it; click 🔊 to hear the pronunciation.</p><div class="vocabgrid">${b.vocab.map((v,j)=>`<div class="vocabitem"><button class="flip" onclick="flip('${p}',${j})" id="flip_${p}_${j}"><div class="face front"><small>${j+1} · ${esc(v[1])}</small><strong>${esc(v[0])}</strong><span>↻ Flip for meaning</span></div><div class="face back hidden"><strong>${esc(v[2])}</strong><span>${esc(v[3])}</span><small>↻ Click to flip back</small></div></button><div class="vocabactions"><button class="iconbutton" onclick='speak(${JSON.stringify(v[0])})' aria-label="Listen">🔊 Listen</button><button class="iconbutton ${state['known_'+p+'_'+j]?'learned':''}" onclick="known('${p}',${j})">${state['known_'+p+'_'+j]?'✓ Known':'○ I know'}</button></div></div>`).join('')}</div></section><section class="card"><span class="eyebrow">STEP 3 · CONTEXT TRANSLATION</span><h2>Translate into Vietnamese</h2><div class="reading compact">${contextHTML(b.context)}</div>${textBox(p+'_context','Dịch toàn bộ đoạn văn sang tiếng Việt...')}<div class="actions">${showAnswer(p+'_context',b.vi)}</div></section><section class="card"><span class="eyebrow">STEP 4 · GUIDED PRACTICE</span><h2>Task 1 · Unscramble Sentences (10)</h2><p>Click the words in the correct order. Vietnamese hints are provided.</p>${b.order.map((x,j)=>orderHTML(p,j,x)).join('')}</section><section class="card"><h2>Task 2 · Translate English → Vietnamese (5)</h2>${b.translate.map((x,j)=>`<div class="exercise"><span class="num">${j+1}</span><p>${esc(x.s)}</p>${textBox(p+'_trans'+j,'Viết bản dịch tiếng Việt...')}<div class="actions">${showAnswer(p+'_trans'+j,x.vi)}</div></div>`).join('')}</section><section class="card"><h2>Task 3 · Choose the Best Response (5)</h2>${b.quiz.map((x,j)=>`<div class="exercise"><span class="num">${j+1}</span><p>${esc(x.q)}</p><div class="options">${x.options.map((o,z)=>`<button class="btn outline option" onclick="choose('${p}_quiz${j}',${z},${x.answer})">${'ABC'[z]}. ${esc(o)}</button>`).join('')}</div>${result(p+'_quiz'+j)}</div>`).join('')}</section><section class="card"><h2>Task 4 · Vocabulary Recall (${b.vocab.length})</h2><p>Write the English word or phrase from the Vietnamese meaning.</p>${b.vocab.map((v,j)=>`<div class="exercise"><span class="num">${j+1}</span><p>${esc(v[2])}</p><input class="short" id="${inputId(p+'_rec'+j)}" value="${esc(state['txt_'+p+'_rec'+j]||'')}" placeholder="English word / phrase..."><div class="actions"><button class="btn tiny" onclick='checkText(${JSON.stringify(p+'_rec'+j)},${JSON.stringify(v[0])})'>Check</button>${showAnswer(p+'_rec'+j,v[0])}</div>${result(p+'_rec'+j)}</div>`).join('')}</section><section class="card"><h2>Task 5 · Fill in the Blanks (3)</h2><p class="muted">Word bank: ${b.fill.map(x=>esc(x.answer)).join(' • ')}</p>${b.fill.map((x,j)=>`<div class="exercise"><span class="num">${j+1}</span><p>${esc(x.sentence)}</p><input class="short" id="${inputId(p+'_fill'+j)}" value="${esc(state['txt_'+p+'_fill'+j]||'')}" placeholder="Type the missing word(s)"><div class="actions"><button class="btn tiny" onclick='checkText(${JSON.stringify(p+'_fill'+j)},${JSON.stringify(x.answer)})'>Check</button>${showAnswer(p+'_fill'+j,x.answer)}</div>${result(p+'_fill'+j)}</div>`).join('')}</section><section class="card"><span class="eyebrow">STEP 5 · GUIDED SPEAKING</span><h2>Talk about ${esc(b.title)}</h2><div class="talkgrid">${b.talk.map((q,j)=>`<div class="talk"><small>QUESTION ${j+1}</small><p>${esc(q)}</p><button class="btn tiny outline" onclick="document.getElementById('hint_${p}_${j}').classList.toggle('hidden')">Show / hide hint</button><div class="muted hidden" id="hint_${p}_${j}">Try: ${esc(b.order[j]['s'])}</div></div>`).join('')}</div><h3>My short speaking paragraph</h3>${textBox(p+'_speak','Speak first, then write 4–6 English sentences...')}${showAnswer(p+'_speak',b.speakModel)}</section><section class="card"><span class="eyebrow">STEP 6 · SPIDERGRAM NOTES</span><h2>My keywords</h2><p>Use short keywords or phrases rather than copying the whole passage.</p>${textBox(p+'_notes','My keywords: places, materials, activities...')}<div class="actions"><button class="btn" onclick="mark('${p}_notes');alert('Notes saved in this browser.')">Save notes</button><button class="btn outline" onclick="go('${i===3?'grammar':'b'+(i+1)}')">Next section →</button></div></section>`;}
function orderHTML(p,j,x){let k=p+'_order'+j;let parts=x.s.replace(/[.?!]$/,'').match(/(?:[^\s]+\s?)/g).map(v=>v.trim());let shuffle=parts.map((a,z)=>({a,z})).sort((u,v)=>((u.z*7+3)%parts.length)-((v.z*7+3)%parts.length));return `<div class="exercise order" data-key="${k}"><span class="num">${j+1}</span><p class="hint">Gợi ý: ${esc(x.vi)}</p><div class="ordered" id="sel_${inputId(k)}"><em>Click the words below...</em></div><div class="wordbank">${shuffle.map(t=>`<button data-idx="${t.z}" class="token" onclick="takeWord('${k}',${t.z},this)">${esc(t.a)}</button>`).join('')}</div><div class="actions"><button class="btn tiny" onclick='checkOrder(${JSON.stringify(k)},${JSON.stringify(x.s)})'>Check</button><button class="btn tiny outline" onclick="resetOrder('${k}')">Try again</button>${showAnswer(k,x.s)}</div>${result(k)}</div>`}
let orders={};function takeWord(k,i,btn){orders[k]??=[];orders[k].push({i,word:btn.innerText});btn.disabled=true;let root=$('#sel_'+inputId(k));root.innerHTML=orders[k].map((it,z)=>`<button class="chosen" onclick="removeWord('${k}',${z})">${esc(it.word)} ×</button>`).join('')}
function removeWord(k,z){let entry=orders[k].splice(z,1)[0];let b=$(`.order[data-key="${k}"] .token[data-idx="${entry.i}"]`);if(b)b.disabled=false;let root=$('#sel_'+inputId(k));root.innerHTML=orders[k].length?orders[k].map((it,m)=>`<button class="chosen" onclick="removeWord('${k}',${m})">${esc(it.word)} ×</button>`).join(''):'<em>Click the words below...</em>'}
function resetOrder(k){orders[k]=[];$all(`.order[data-key="${k}"] .token`).forEach(b=>b.disabled=false);$('#sel_'+inputId(k)).innerHTML='<em>Click the words below...</em>';$('#res_'+inputId(k)).textContent='';}
function normalize(t){return t.toLowerCase().replace(/[’]/g,"'").replace(/[^a-z0-9\s']/g,'').replace(/\s+/g,' ').trim()}
function checkOrder(k,a){let got=(orders[k]||[]).map(w=>w.word).join(' ');feedback(k,normalize(got)===normalize(a),'Correct! Great job.','Check the word order and try again.');}
function known(p,j){state['known_'+p+'_'+j]=!state['known_'+p+'_'+j];mark(p+'_flash'+j);render()}
function flip(p,j){let root=$('#flip_'+p+'_'+j);root.querySelector('.front').classList.toggle('hidden');root.querySelector('.back').classList.toggle('hidden');}
function speak(s){if(!('speechSynthesis' in window)){alert('Speech playback is not available in this browser.');return;}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(s);u.lang='en-GB';u.rate=.85;speechSynthesis.speak(u)}
function feedback(k,ok,yes,no){let el=$('#res_'+inputId(k));if(el){el.textContent=ok?yes:no;el.className='feedback '+(ok?'good':'bad')}if(ok)mark(k)}
function checkText(k,a){let inp=$('#'+inputId(k));let got=inp?.value||'';state['txt_'+k]=got;save();feedback(k,normalize(got)===normalize(a),'✓ Correct!','Not quite. Try again or compare with the model answer.');}
function choose(k,z,a){state['choice_'+k]=z;save();feedback(k,z===a,'✓ Correct answer!','Try again.');}
function grammarHTML(){return `<div class="pagehead"><span class="eyebrow">PART B · GRAMMAR</span><h1>✎ Grammar Practice</h1><p>130 exercises • Question formation and countable/uncountable nouns.</p></div><div class="card"><h2>Question Formation • Quick Rules</h2><div class="rulegrid"><div><h3>TO BE</h3><p><b>Am / Is / Are / Was / Were + S + ...?</b></p><p>They are from Ha Giang. → Are they from Ha Giang?</p></div><div><h3>MODAL VERB</h3><p><b>Modal + S + (to) V...?</b></p><p>She can weave cloth. → Can she weave cloth?</p></div><div><h3>ORDINARY VERB</h3><p><b>Do / Does / Did + S + V (base form)...?</b></p><p>She grows rice. → Does she grow rice?</p></div></div><p class="muted">Special forms: <b>Ought + S + to + V?</b>; <b>Had + S + better + V?</b>. These are formal/less common question patterns; students practise them here as requested.</p></div>${questionBlock('4.1','Questions with TO BE (20)',DATA.grammar.be,'be')}${questionBlock('4.2','Questions with Modal Verbs (20)',DATA.grammar.modal,'modal')}${questionBlock('4.3','Questions with Ordinary Verbs (20)',DATA.grammar.ordinary,'ordinary')}${questionBlock('4.4','Mixed Practice · Write the WHOLE question (20)',DATA.grammar.mixed,'mixed',true)}<section class="card"><span class="eyebrow">4.5 · COUNTABLE / UNCOUNTABLE</span><h2>Write C or U (30 nouns)</h2><p><b>C</b> = countable; <b>U</b> = uncountable. In this exercise, classify the usual meaning of each word.</p><div class="twocol">${DATA.grammar.nouns.map(([w,a],i)=>`<div class="compactexercise"><b>${i+1}. ${esc(w)}</b><select id="${inputId('noun'+i)}" onchange="saveSelect('noun${i}',this.value)"><option value="">C or U?</option><option value="C" ${state['sel_noun'+i]==='C'?'selected':''}>C</option><option value="U" ${state['sel_noun'+i]==='U'?'selected':''}>U</option></select><button class="btn tiny outline" onclick="checkSelect('noun${i}','${a}')">Check</button>${result('noun'+i)}${state.teacher?`<small>${a}</small>`:''}</div>`).join('')}</div></section><section class="card"><span class="eyebrow">4.6 · QUANTIFIERS</span><h2>a / much / many / a little / a few (20)</h2><p>Use <b>a</b> with a singular countable noun; <b>many / a few</b> with plural countable nouns; <b>much / a little</b> with uncountable nouns.</p>${DATA.grammar.quant.map(([s,a],i)=>`<div class="exercise"><span class="num">${i+1}</span><p>${esc(s)}</p><select id="${inputId('quant'+i)}" onchange="saveSelect('quant${i}',this.value)"><option value="">Choose a quantifier...</option>${['a','much','many','a little','a few'].map(t=>`<option value="${t}" ${state['sel_quant'+i]===t?'selected':''}>${t}</option>`).join('')}</select><button class="btn tiny" onclick='checkSelect(${JSON.stringify('quant'+i)},${JSON.stringify(a)})'>Check</button>${state.teacher?`<span class="teacheranswer">${a}</span>`:''}${result('quant'+i)}</div>`).join('')}</section>`}
function questionBlock(n,title,data,tag,mixed=false){return `<section class="card"><span class="eyebrow">${n} · QUESTION FORMATION</span><h2>${title}</h2>${mixed?`<p class="attention"><b>Instruction:</b> Turn each full statement into a complete Yes/No question. Write the WHOLE question on the line. Choose the correct helping verb yourself; do not merely fill one blank.</p><p class="muted"><b>Helping verb bank:</b> Am · Is · Are · Was · Were · Do · Does · Did · Can · Could · Must · May · Might · Should · Ought to · Had better</p><div class="exercise"><p><b>Example:</b> The farmers are harvesting their crops in the fields.</p><p>→ ____________________________________________?</p><p class="muted">Model: Are the farmers harvesting their crops in the fields?</p></div>`:`<p>Rewrite each statement as a complete Yes/No question.</p>`}${data.map(([s,a],i)=>`<div class="exercise"><span class="num">${i+1}</span><p>${esc(s)}</p><div class="arrowline">→ ${textBox('g_'+tag+i,'Write the complete question ending with ?')}</div><div class="actions"><button class="btn tiny" onclick='checkQuestion(${JSON.stringify('g_'+tag+i)},${JSON.stringify(a)})'>Check</button>${showAnswer('g_'+tag+i,a)}</div>${result('g_'+tag+i)}${state.teacher?`<div class="teacheranswer">${esc(a)}</div>`:''}</div>`).join('')}</section>`}
function checkQuestion(k,a){let inp=$('#'+inputId(k));let got=inp?.value||'';state['txt_'+k]=got;save();feedback(k,normalize(got)===normalize(a),'✓ Correct question!','Please check your auxiliary, subject and verb form. Compare with model if necessary.');}
function saveSelect(k,v){state['sel_'+k]=v;save()}
function checkSelect(k,a){feedback(k,state['sel_'+k]===a,'✓ Correct!','Try again.');}
function finalHTML(){let script=state['txt_final']||'';return `<div class="pagehead"><span class="eyebrow">PART C · FINAL PRODUCTION</span><h1>🎤 My Favourite Ethnic Group</h1><p>Build a 1–2 minute presentation using your spidergram keywords.</p></div><section class="card"><h2>Presentation structure</h2><div class="steps"><span>Introduction</span><span>Living place & population</span><span>Houses</span><span>Culture</span><span>Daily life</span><span>Closing</span></div><p><b>Suggested opening:</b> Good morning! Today, I would like to talk about an ethnic group in Viet Nam.</p><p><b>Useful starters:</b> They live in… / Their traditional houses are… / They enjoy… / Many people earn a living by… / I find their culture interesting because…</p><h3>My spidergram notes</h3>${DATA.branches.map((b,i)=>`<div class="noteitem"><b>${b.icon} ${esc(b.title)}</b><p>${esc(state['txt_b'+i+'_notes']||'No notes yet. Return to this branch to add keywords.')}</p></div>`).join('')}<h3>Write my complete presentation</h3><textarea id="${inputId('final')}" class="answer" rows="10" placeholder="Good morning, everyone! Today I would like to talk about...">${esc(script)}</textarea><div class="actions"><button class="btn" onclick="copyScript()">Copy my presentation</button><button class="btn outline" onclick="printScript()">Print presentation</button><button class="btn outline" onclick="saveFinal()">Save draft</button></div><h3>Self-assessment checklist</h3>${['I introduced the ethnic group.','I mentioned where they live.','I described houses and culture.','I described daily life or work.','I used vocabulary from Unit 4.','I spoke clearly and finished with a closing.'].map((x,i)=>`<label class="checkline"><input type="checkbox" ${state['tick_'+i]?'checked':''} onchange="state['tick_${i}']=this.checked;save()"> ${x}</label>`).join('')}${showAnswer('final','Good morning, everyone! Today I would like to talk about the Tay people in Viet Nam. Many Tay families live in the northern highlands. Some live in stilt houses made from natural materials. Their houses often overlook fields. The Tay have their own traditional clothes, food and festivals. Many families grow crops and raise livestock. I think their culture is very interesting. Thank you for listening!')}</section>`}
function saveFinal(){state['txt_final']=$('#'+inputId('final')).value;mark('final');alert('Presentation saved.')}
function copyScript(){saveFinal();let t=state['txt_final'];if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(t).then(()=>alert('Copied!')).catch(()=>fallbackCopy(t))}else fallbackCopy(t)}
function fallbackCopy(t){let el=$('#'+inputId('final'));el.select();try{document.execCommand('copy');alert('Copied!')}catch(e){alert('Select and copy your presentation manually.')}}
function printScript(){saveFinal();let txt=state['txt_final'];let w=window.open('','_blank');if(!w){alert('Please allow pop-ups to print.');return;}w.document.write('<!doctype html><html><head><meta charset="utf-8"><title>My Presentation</title><style>body{font:18px/1.7 Arial;padding:36px;white-space:pre-wrap}</style></head><body><h2>My Favourite Ethnic Group</h2>'+esc(txt)+'</body></html>');w.document.close();w.focus();w.print();}
function initInteractions(){let inputs=$all('textarea.answer, input.short');inputs.forEach(el=>{el.addEventListener('input',()=>{let k=el.id.replace(/^v_/,''); // preserve keys via matching regenerated ids
 let key=Object.keys(state).find(v=>v.startsWith('txt_')&&inputId(v.slice(4))===el.id);if(!key){let keys=[];DATA.branches.forEach((b,i)=>{let p='b'+i;keys.push(p+'_context',p+'_speak',p+'_notes',...b.translate.map((_,j)=>p+'_trans'+j),...b.vocab.map((_,j)=>p+'_rec'+j),...b.fill.map((_,j)=>p+'_fill'+j))});for(let tag of ['be','modal','ordinary','mixed'])for(let j=0;j<20;j++)keys.push('g_'+tag+j);keys.push('final');let m=keys.find(q=>inputId(q)===el.id);if(m)key='txt_'+m;}if(key){state[key]=el.value;save();}})});}
render();
</script></body></html>
